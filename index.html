    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f0f4f8;
            transition: background-color 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            flex-direction: column;
            padding: 1rem;
            position: relative;
        }

        /* Boss Stage Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #FFDF00, #DAA520, #FFF8DC, #FFDF00);
            background-size: 300% 300%;
            animation: gradientMove 4s ease infinite;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: -2;
            pointer-events: none;
        }
        body.boss-bg::before {
            opacity: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Sparkles for Boss Stage */
        #sparkles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #FFF, 0 0 20px 5px #FFDF00;
            opacity: 0;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Boss Title */
        .boss-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #b37700;
            text-align: center;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: all 0.5s ease;
            text-shadow: 0 2px 5px rgba(255, 215, 0, 0.5);
            margin: 0;
        }
        .boss-title.show {
            opacity: 1;
            height: auto;
            margin-bottom: 1rem;
            animation: pulseTitle 2s infinite;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* +10 Animated Text */
        .plus-10-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 6rem;
            font-weight: 900;
            color: #FFDF00;
            text-shadow: 0 0 20px rgba(218, 165, 32, 0.9), 3px 3px 6px rgba(0,0,0,0.4);
            opacity: 0;
            z-index: 1000;
            animation: popInAndFade 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popInAndFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; }
        }

        /* 3D Confetti */
        .confetti-3d {
            position: absolute;
            animation: fall3d linear forwards;
            transform-style: preserve-3d;
        }

        @keyframes fall3d {
            0% { transform: translateY(-10vh) rotateX(0deg) rotateY(0deg) rotateZ(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh) rotateX(720deg) rotateY(360deg) rotateZ(720deg); opacity: 0; }
        }

        /* Welcome screen styles */
        #welcomeScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #f0f4f8;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            z-index: 10;
        }

        .welcome-text h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .welcome-text h2 { font-size: 3rem; font-weight: bold; color: #1a202c; margin-bottom: 0.5rem; }
        .welcome-text h3 { font-size: 1.5rem; color: #4a5568; }

        .iran-flag-small {
            width: 80px;
            height: auto;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
        }

        .play-button, .restart-button {
            background-color: #10b981;
            color: white;
            padding: 1rem 3rem;
            border-radius: 9999px;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out, transform 0.3s ease-in-out;
            margin-top: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
        }

        .play-button:hover:not(:disabled), .restart-button:hover {
            background-color: #0c9e6c;
            transform: translateY(-2px);
        }
        
        .play-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            position: absolute;
            bottom: 1rem;
            color: #a0aec0;
            font-size: 0.875rem;
        }
        
        .loading-message {
            margin-top: 1rem;
            font-size: 1rem;
            color: #4a5568;
            transition: opacity 0.5s;
        }
        
        /* Game over modal/message styles */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        #gameOverScreen.show {
            opacity: 1;
            pointer-events: auto;
        }

        #gameOverMessage {
            font-size: 2rem;
            font-weight: bold;
            color: #dc3545;
        }

        #finalScore {
            font-size: 1.5rem;
            margin-top: 1rem;
            color: #4a5568;
        }

        /* Main Game Container */
        .container {
            width: 100%;
            max-width: 500px !important;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
            box-sizing: border-box;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            min-height: 80vh;
            z-index: 5;
            transition: transform 0.3s ease;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .flag-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding-bottom: 1rem;
            min-height: 200px;
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 1rem;
            overflow: hidden;
            perspective: 1000px;
            position: relative;
        }

        .flag-img {
            max-width: 95%;
            max-height: 95%;
            width: auto;
            height: auto;
            border-radius: 1rem;
            object-fit: contain;
            position: absolute;
            backface-visibility: hidden;
        }
        
        .flag-img.peel-away { animation: peelAway 0.5s forwards ease-in-out; }
        @keyframes peelAway {
            0% { transform: rotateY(0deg) scale(1); opacity: 1; }
            100% { transform: rotateY(90deg) scale(0.9); opacity: 0; }
        }
        
        .flag-img.peel-in { animation: peelIn 0.5s forwards ease-in-out; }
        @keyframes peelIn {
            0% { transform: rotateY(-90deg) scale(0.9); opacity: 0; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            width: 100%;
        }
        
        .option-button {
            background-color: #e9e9e9;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            color: #333;
            font-weight: bold;
            font-family: 'Vazirmatn', sans-serif;
        }
        
        .option-button:hover:not(.correct):not(.wrong):not(:disabled) {
            background-color: #dcdcdc;
            transform: translateY(-2px);
        }

        .option-button.correct { background-color: #28a745 !important; color: white; border-color: #218838; }
        .option-button.wrong { background-color: #dc3545 !important; color: white; border-color: #c82333; }
        
        .message {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 1rem;
            color: #333;
            min-height: 1.8rem;
        }

        .timer { font-size: 1.5rem; font-weight: 600; color: #ef4444; }
        .score-display { font-size: 1.5rem; font-weight: 600; color: #3b82f6; }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 999;
        }

        .confetti {
            position: absolute;
            background-color: #f7e15d;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            animation: fall 3s infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .options-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

</div>

<!-- Main Game Container -->

    <div id="options-container" class="options-container"></div>
    <div id="message" class="message"></div>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen">

        "https://flagcdn.com/w320/sb.png": "جزایر سلیمان",
        "https://flagcdn.com/w320/uz.png": "ازبکستان",
        "https://flagcdn.com/w320/il.png": "اسرائیل",
        "https://flagcdn.com/w320/gb-wls.png": "ولز",
        "https://flagcdn.com/w320/gb-eng.png": "انگلستان",
        "https://flagcdn.com/w320/gb-sct.png": "اسکاتلند",
        "https://flagcdn.com/w320/gb-nir.png": "ایرلند شمالی",
        "https://flagcdn.com/w320/gd.png": "گرنادا",
        "https://flagcdn.com/w320/gt.png": "گواتمالا",
        "https://flagcdn.com/w320/kp.png": "کره شمالی",
        "https://flagcdn.com/w320/la.png": "لائوس",
        "https://flagcdn.com/w320/mt.png": "مالت",
        "https://flagcdn.com/w320/fm.png": "میکرونزی",
        "https://flagcdn.com/w320/mc.png": "موناکو",
        "https://flagcdn.com/w320/xk.png": "کوزوو",
        "https://flagcdn.com/w320/eh.png": "صحرای غربی"
    };

    // گروه بندی پرچم‌های بسیار مشابه برای مرحله ویژه
    const similarFlags = [
        ["ایران", "ایتالیا", "مکزیک", "مجارستان", "تاجیکستان", "بلغارستان"],
        ["سوئد", "نروژ", "فنلاند", "دانمارک", "ایسلند"],
        ["مصر", "سوریه", "عراق", "یمن", "سودان", "سودان جنوبی", "امارات", "فلسطین", "کویت", "اردن"],
        ["رومانی", "چاد", "آندورا", "مولداوی"],
        ["اندونزی", "موناکو", "لهستان", "سنگاپور", "گرینلند"],
        ["ایرلند", "ساحل عاج", "هند"],
        ["استرالیا", "نیوزیلند", "فیجی", "تووالو"],
        ["روسیه", "اسلواکی", "اسلوونی", "صربستان", "کرواسی", "پاراگوئه", "هلند", "لوکزامبورگ", "فرانسه"],
        ["گینه", "مالی", "سنگال", "کامرون", "غنا", "بنین", "توگو", "کنگو - برازاویل"],
        ["کلمبیا", "ونزوئلا", "اکوادور"],
        ["آرژانتین", "السالوادور", "هندوراس", "نیکاراگوئه", "گواتمالا"],
        ["چین", "ویتنام", "مراکش", "ترکیه", "تونس", "سومالی"],
        ["بحرین", "قطر"],
        ["آمریکا", "مالزی", "لیبریا", "پورتوریکو", "شیلی", "کوبا"]
    ];

    // Get DOM elements
    const body = document.body;
    const welcomeScreen = document.getElementById('welcomeScreen');
    const playBtn = document.getElementById('playBtn');
    const loadingMessage = document.getElementById('loadingMessage');
    const gameContainer = document.getElementById('gameContainer');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameOverMessage = document.getElementById('gameOverMessage');
    const finalScoreDisplay = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const flagImg = document.getElementById('flag');
    const optionsContainer = document.getElementById('options-container');
    const messageDisplay = document.getElementById('message');
    const timerDisplay = document.getElementById('timer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const confettiContainer = document.getElementById('confetti-container');
    const bossTitle = document.getElementById('bossTitle');
    const sparklesContainer = document.getElementById('sparkles-container');

    let currentCountry = null;
    let timerInterval = null;
    let timeLeft = 10;
    let score = 0;
    let questionCount = 0;
    let flagUrls = [];
    let isGameRunning = false;
    let isPreloading = false;
    let isBossStage = false;
    
    // Function to preload all flag images
    function preloadImages() {
        if (isPreloading) return;
        isPreloading = true;
        loadingMessage.style.opacity = '1';
        
        const urls = Object.keys(flags);
        let loadedCount = 0;
        const totalImages = urls.length;
        
        urls.forEach(url => {
            const img = new Image();
            const onloadCallback = () => {
                loadedCount++;
                if (loadedCount === totalImages) {
                    loadingMessage.textContent = 'آماده! ✨';
                    setTimeout(() => { loadingMessage.style.opacity = '0'; }, 1000);
                    playBtn.disabled = false;
                }
            };
            img.onload = onloadCallback;
            img.onerror = onloadCallback;
            img.src = url;
        });
    }

    // Function to shuffle an array
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Reset game parameters and start
    function startNewGame() {
        score = 0;
        questionCount = 0;
        isBossStage = false;
        scoreDisplay.textContent = 'امتیاز: ۰';
        flagUrls = shuffleArray(Object.keys(flags));
        isGameRunning = true;
        
        // Clean up boss stage UI if restarting
        body.classList.remove('boss-bg');
        bossTitle.classList.remove('show');
        sparklesContainer.innerHTML = '';
        gameOverScreen.classList.remove('show');
        
        loadNextQuestion();
    }

    // Create sparkles for boss stage
    function createSparkles() {
        sparklesContainer.innerHTML = '';
        for(let i=0; i<40; i++) {
            let s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.animationDelay = (Math.random() * 2) + 's';
            s.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
            sparklesContainer.appendChild(s);
        }
    }

    // Determine correct timer base logic
    function getTimerLimit() {
        // Decrease 1 sec per 50 points, min 5 secs
        return Math.max(5, 10 - Math.floor(score / 50));
    }

    // Function to load the next question
    function loadNextQuestion() {
        clearInterval(timerInterval);
        optionsContainer.innerHTML = '';
        messageDisplay.textContent = '';
        timerDisplay.style.color = '#ef4444';
        confettiContainer.innerHTML = '';

        if (flagUrls.length === 0) {
            endGame();
            return;
        }

        questionCount++;
        // Activate boss stage every 20 questions
        isBossStage = (questionCount > 0 && questionCount % 20 === 0);

        if (isBossStage) {
            body.classList.add('boss-bg');
            bossTitle.classList.add('show');
            createSparkles();
        } else {
            body.classList.remove('boss-bg');
            bossTitle.classList.remove('show');
            sparklesContainer.innerHTML = '';
        }

        const randomUrl = flagUrls.pop();
        const nextCountry = flags[randomUrl];

        // Animate the current flag out, then load the new one
        flagImg.classList.add('peel-away');

        setTimeout(() => {
            flagImg.src = randomUrl;
            currentCountry = nextCountry;
            flagImg.classList.remove('peel-away');
            flagImg.classList.add('peel-in');
            
            flagImg.addEventListener('animationend', () => {
                flagImg.classList.remove('peel-in');
            }, { once: true });

            const allCountries = Object.keys(flags).map(key => flags[key]);
            let wrongOptions = [];

            if (isBossStage) {
                // Find if the current country belongs to a similar group
                let group = similarFlags.find(g => g.includes(currentCountry));
                if (group) {
                    wrongOptions = group.filter(c => c !== currentCountry && allCountries.includes(c));
                }
                
                // If the similar group doesn't have enough countries, fill with random ones
                if (wrongOptions.length < 3) {
                    let availableRandoms = shuffleArray(allCountries.filter(c => c !== currentCountry && !wrongOptions.includes(c)));
                    wrongOptions = wrongOptions.concat(availableRandoms.slice(0, 3 - wrongOptions.length));
                } else {
                    wrongOptions = shuffleArray(wrongOptions).slice(0, 3);
                }
            } else {
                // Normal random options
                wrongOptions = shuffleArray(allCountries.filter(c => c !== currentCountry)).slice(0, 3);
            }

            const optionsPool = [currentCountry, ...wrongOptions];
            const shuffledOptions = shuffleArray(optionsPool);

            // Create option buttons
            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.classList.add('option-button');
                button.textContent = option;
                button.dataset.name = option;
                button.addEventListener('click', handleGuess);
                optionsContainer.appendChild(button);
            });

            // Start the timer for the new question
            timeLeft = getTimerLimit();
            timerDisplay.textContent = `زمان: ${timeLeft}`;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `زمان: ${timeLeft}`;
                if (timeLeft <= 0) {
                    handleGuess(null); // Timeout
                }
            }, 1000);
        }, 500);
    }

    // Function to handle the user's guess or a timeout
    function handleGuess(event) {
        if (!isGameRunning) return;
        isGameRunning = false;
        
        clearInterval(timerInterval);
        const allButtons = optionsContainer.querySelectorAll('.option-button');
        allButtons.forEach(btn => btn.disabled = true); 

        let isCorrect = false;
        let userGuess = "";
        if (event) {
            userGuess = event.target.dataset.name;
            if (userGuess === currentCountry) {
                isCorrect = true;
            }
        }

        if (isCorrect) {
            event.target.classList.add('correct');
            
            if (isBossStage) {
                score += 10;
                messageDisplay.textContent = "فوق‌العاده! +۱۰ امتیاز ویژه 🌟";
                showPlus10();
                create3DConfetti();
                
                // Gently fade out the boss background upon victory
                body.classList.remove('boss-bg');
                bossTitle.classList.remove('show');
                sparklesContainer.innerHTML = '';
            } else {
                score++;
                messageDisplay.textContent = "درسته! عالی بودی 🎉";
                createConfetti();
            }
            
            scoreDisplay.textContent = `امتیاز: ${score}`;
            
            setTimeout(() => {
                isGameRunning = true;
                loadNextQuestion();
            }, 1500);
        } else {
            // Find and highlight the correct answer
            const correctButton = Array.from(allButtons).find(btn => btn.dataset.name === currentCountry);
            if (correctButton) {
                correctButton.classList.add('correct');
            }
            if (event) {
                event.target.classList.add('wrong');
            }
            
            endGame();
        }
    }

    // Function to end the game
    function endGame() {
        clearInterval(timerInterval);
        gameContainer.style.display = 'none';
        gameOverScreen.classList.add('show');
        gameOverMessage.textContent = "❌ باختی! گزینه صحیح: " + currentCountry;
        finalScoreDisplay.textContent = "امتیاز نهایی: " + score;
        
        // Remove boss background if lost on boss stage
        body.classList.remove('boss-bg');
        bossTitle.classList.remove('show');
        sparklesContainer.innerHTML = '';
    }

    // Normal Confetti (2D circles)
    function createConfetti() {
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = `${Math.random() * 100}vw`;
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            confetti.style.animationDelay = `${Math.random() * 1}s`;
            confetti.style.animationDuration = `${Math.random() * 1 + 2}s`;
            confettiContainer.appendChild(confetti);
        }
    }

    // 3D Confetti (Squares/Rectangles) for Boss Stage
    function create3DConfetti() {
        for (let i = 0; i < 70; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-3d');
            confetti.style.left = `${Math.random() * 100}vw`;
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            
            const size = Math.random() * 10 + 8;
            confetti.style.width = `${size}px`;
            // 50% chance to be a rectangle
            confetti.style.height = `${Math.random() > 0.5 ? size : size * 2}px`; 
            
            confetti.style.animationDelay = `${Math.random() * 0.5}s`;
            confetti.style.animationDuration = `${Math.random() * 1.5 + 2}s`;
            confettiContainer.appendChild(confetti);
        }
    }

    // Show floating +10 animation
    function showPlus10() {
        const plus10 = document.createElement('div');
        plus10.className = 'plus-10-text';
        plus10.textContent = '+10';
        document.body.appendChild(plus10);
        setTimeout(() => plus10.remove(), 1600);
    }

    // Event Listeners
    playBtn.addEventListener('click', () => {
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.transform = 'translateY(-100%)';
        setTimeout(() => {
            welcomeScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            startNewGame();
        }, 1000);
    });

    restartBtn.addEventListener('click', () => {
        startNewGame();
        gameContainer.style.display = 'flex';
        gameOverScreen.classList.remove('show');
    });

    // Initial load, preload images
    window.onload = () => {
        welcomeScreen.style.display = 'flex';
        gameContainer.style.display = 'none';
        gameOverScreen.style.display = 'flex';
        gameOverScreen.classList.remove('show');
        preloadImages();
    };
</script>
